services:
  postgres:
    image: postgres:16-alpine
    container_name: electTN-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electTN}
      POSTGRES_USER: ${POSTGRES_USER:-electTN}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-electTN} -d ${POSTGRES_DB:-electTN}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data: