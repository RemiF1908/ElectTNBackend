# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: api
output: internal/api/generated.go
generate:
  echo-server: true      # Generate Echo server handlers
  strict-server: true    # Generate strict server with response wrapper types
  models: true           # Generate request/response types
  embedded-spec: true    # Embed OpenAPI spec for documentation
  client: true
output-options:
  skip-fmt: false        # Format generated code
  skip-prune: false      # Remove unused types
  nullable-type: true    # Use nullable.Nullable for better null handling
